name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (vet + race tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: go/go.sum
      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.35.2
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate stubs
        # grpcio-tools ships protoc, so the job needs no apt packages.
        run: |
          pip install --quiet grpcio-tools==1.68.1
          mkdir -p go/gen
          python -m grpc_tools.protoc -I./proto \
            --go_out=go/gen --go_opt=module=github.com/aabhimittal/grpc-kubernetes/go/gen \
            --go-grpc_out=go/gen --go-grpc_opt=module=github.com/aabhimittal/grpc-kubernetes/go/gen \
            proto/inference.proto
      - name: gofmt
        run: |
          cd go
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet
        run: cd go && go vet ./...
      - name: go test -race
        run: cd go && go test -race -count=1 ./...

  python:
    name: Python (unit + e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - name: Install dependencies
        run: |
          pip install --quiet -r python/requirements.txt
          pip install --quiet pytest
      - name: Generate stubs
        run: make gen-python
      - name: pytest
        run: python -m pytest python/tests -q

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate manifests
        run: |
          pip install --quiet pyyaml
          python scripts/validate_manifests.py
